pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Lets Gradle download the JDK 25 toolchain automatically when it is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Apeira'

include ':apeira-core'
include ':apeira-decor'
include ':apeira-story'
include ':apeira-main'
