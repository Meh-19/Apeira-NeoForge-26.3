// The UI capture tool (apeira-uicapture) for Fabric 26.3: the NeoForge module's code with Fabric API's hooks in place of
// NeoForge's events (the same hooks as the 1.21.11 Fabric build in tools/uicapture-fabric).
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = mod_version
group = 'com.apeira'
base { archivesName = 'apeira_uicapture-fabric-26.3' }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand version: version }
}
