// Content module. Shared configuration comes from the root build.gradle.

def libraryModules = [':apeira-core', ':apeira-decor', ':apeira-story']
// Modules this module does not compile against, only loads in its runs: archaeology content, the dev tools and the UI capture tool.
def contentModules = [':apeira-archae', ':apeira-dev', ':apeira-uicapture']

dependencies {
    libraryModules.each { implementation project(it) }
    contentModules.each { localRuntime project(it) }
}

// Every Apeira mod id, used to bind sources to mods and to enable their gametests.
def allMods = [(mod_id): project] + (libraryModules + contentModules).collectEntries { path ->
    def p = project(path)
    [(p.property('mod_id')): p]
}

// apeira-decor and apeira-archae generate their resources from this module's decorData and archaeData runs.
def decorProject = project(':apeira-decor')
def archaeProject = project(':apeira-archae')

neoForge {
    // GeckoLib's interface injections, so the entity renderers compile (see apeira-decor).
    interfaceInjectionData {
        from decorProject.file('geckolib_interface_injections.json')
    }

    // Tell NeoForge which source sets belong to which mod so all seven load as separate mods in dev runs.
    mods {
        allMods.each { id, p ->
            register(id) { sourceSet(p.sourceSets.main) }
        }
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Runs all registered gametests, then exits.
        gameTestServer {
            type = 'gameTestServer'
        }

        data {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        // apeira-decor's blocks (furniture) and entities, written to that module's own generated resources.
        decorData {
            clientData()
            programArguments.addAll '--mod', decorProject.property('mod_id'), '--all',
                    '--output', decorProject.file('src/generated/resources/').absolutePath,
                    '--existing', decorProject.file('src/main/resources/').absolutePath
        }

        // apeira-archae's artifacts, fragments and assembly table, written to that module's own generated resources.
        archaeData {
            clientData()
            programArguments.addAll '--mod', archaeProject.property('mod_id'), '--all',
                    '--output', archaeProject.file('src/generated/resources/').absolutePath,
                    '--existing', archaeProject.file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', allMods.keySet().join(',')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}
