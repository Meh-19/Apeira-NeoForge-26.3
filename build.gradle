// Shared configuration for every Apeira module. Subproject build scripts only declare
// what is specific to them (project dependencies and, for apeira-main, run configurations).
plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'idea'
    apply plugin: 'net.neoforged.moddev'

    version = mod_version
    group = mod_group_id

    base {
        archivesName = mod_id
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
    }

    repositories {
        // NeoForge and Minecraft repositories are added by the ModDevGradle plugin.
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content { includeGroupByRegex 'software\\.bernie.*' }
        }
        maven {
            name = 'Curios'
            url = 'https://maven.theillusivec4.top/'
            content { includeGroup 'top.theillusivec4.curios' }
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        maven {
            name = 'Jared (JEI)'
            url = 'https://maven.blamejared.com/'
            content { includeGroup 'mezz.jei' }
        }
    }

    neoForge {
        version = neo_version
        // Access Transformers at src/main/resources/META-INF/accesstransformer.cfg are detected automatically.
    }

    sourceSets.main.resources {
        // Resources produced by data generators.
        srcDir 'src/generated/resources'
        exclude '**/*.bbmodel'
        exclude 'src/generated/**/.cache'
    }

    // 'localRuntime' holds runtime-only dev dependencies that are not published to dependents.
    configurations {
        runtimeClasspath.extendsFrom localRuntime
    }

    // Expands ${...} properties in src/main/templates (the neoforge.mods.toml of each module).
    def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
        def replaceProperties = [
                minecraft_version      : minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neo_version            : neo_version,
                mod_id                 : mod_id,
                mod_name               : mod_name,
                mod_description        : mod_description,
                mod_license            : mod_license,
                mod_version            : mod_version,
                mod_authors            : mod_authors,
        ]
        inputs.properties replaceProperties
        expand replaceProperties
        from 'src/main/templates'
        into 'build/generated/sources/modMetadata'
    }
    sourceSets.main.resources.srcDir generateModMetadata
    neoForge.ideSyncTask generateModMetadata

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven { url = "file://${rootProject.projectDir}/repo" }
        }
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
